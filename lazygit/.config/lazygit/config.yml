gui:
  # stuff relating to the UI
  scrollHeight: 2 # how many lines you scroll by
  scrollPastBottom: true # enable scrolling past the bottom
  sidePanelWidth: 0.3333 # number from 0 to 1
  expandFocusedSidePanel: false
  mainPanelSplitMode: "flexible" # one of 'horizontal' | 'flexible' | 'vertical'
  language: "auto" # one of 'auto' | 'en' | 'zh' | 'pl' | 'nl' | 'ja' | 'ko'
  timeFormat: "02 Jan 06 15:04 MST" # https://pkg.go.dev/time#Time.Format
  theme:
    selectedLineBgColor:
      - reverse # set to `default` to have no background colour
  commitLength:
    show: true
  mouseEvents: true
  skipDiscardChangeWarning: false
  skipStashWarning: false
  showFileTree: true # for rendering changes files in a tree format
  showListFooter: true # for seeing the '5 of 20' message in list panels
  showRandomTip: true
  showBottomLine: true # for hiding the bottom information line (unless it has important information to tell you)
  showCommandLog: true
  nerdFontsVersion: "3"
  showFileIcons: true
  border: single
  commandLogSize: 8
  splitDiff: "auto" # one of 'auto' | 'always'
git:
  diffRenderers:
    - colorArg: always
      useConfig: false
      type: rawGit
  commit:
    signOff: false
  merging:
    # only applicable to unix users
    manualCommit: false
    # extra args passed to `git merge`, e.g. --no-ff
    args: ""
  log:
    # one of date-order, author-date-order, topo-order.
    # topo-order makes it easier to read the git log graph, but commits may not
    # appear chronologically. See https://git-scm.com/docs/git-log#_commit_ordering
    order: "topo-order"
    # one of always, never, when-maximised
    # this determines whether the git graph is rendered in the commits panel
    showGraph: "when-maximised"
    # displays the whole git graph by default in the commits panel (equivalent to passing the `--all` argument to `git log`)
    showWholeGraph: false
  skipHookPrefix: WIP
  autoFetch: true
  autoRefresh: true
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"
  overrideGpg: false # prevents lazygit from spawning a separate process when using GPG
  disableForcePushing: false
  parseEmoji: false
  allBranchesLogCmds:
    - git log --graph --all --color=always --abbrev-commit --decorate --date=relative  --pretty=medium
os:
  copyToClipboardCmd: "" # See 'Custom Command for Copying to Clipboard' section
  editPreset: "" # see 'Configuring File Editing' section
  edit: ""
  editAtLine: ""
  editAtLineAndWait: ""
  open: ""
  openLink: ""
refresher:
  refreshInterval: 10 # File/submodule refresh interval in seconds. Auto-refresh can be disabled via option 'git.autoRefresh'.
  fetchInterval: 60 # Re-fetch interval in seconds. Auto-fetch can be disabled via option 'git.autoFetch'.
update:
  method: prompt # can be: prompt | background | never
  days: 14 # how often an update is checked for
confirmOnQuit: false
# determines whether hitting 'esc' will quit the application when there is nothing to cancel/close
quitOnTopLevelReturn: false
disableStartupPopups: false
notARepository: "prompt" # one of: 'prompt' | 'create' | 'skip'
promptToReturnFromSubprocess: true # display confirmation when subprocess terminates
keybinding:
  universal:
    quit: "q"
    quit-alt1: "<ctrl+c>"
    return: "<esc>"
    quitWithoutChangingDirectory: "Q"
    togglePanel: "<tab>"

    prevItem: "<up>"
    nextItem: "<down>"
    prevItem-alt: "k"
    nextItem-alt: "j"

    prevPage: ","
    nextPage: "."
    gotoTop: "<"
    gotoBottom: ">"

    scrollLeft: "H"
    scrollRight: "L"

    prevBlock: "<left>"
    nextBlock: "<right>"
    prevBlock-alt: "h"
    nextBlock-alt: "l"

    jumpToBlock: ["1", "2", "3", "4", "5"]

    nextMatch: "n"
    prevMatch: "N"
    optionMenu-alt1: "?"
    select: "<space>"
    goInto: "<enter>"

    openRecentRepos: "<ctrl+r>"

    confirm: "<enter>"
    remove: "d"
    new: "n"
    edit: "e"
    openFile: "o"

    scrollUpMain: "<pgup>"
    scrollDownMain: "<pgdown>"
    scrollUpMain-alt1: "K"
    scrollDownMain-alt1: "J"
    scrollUpMain-alt2: "<ctrl+u>"
    scrollDownMain-alt2: "<ctrl+d>"

    executeShellCommand: ":"
    createRebaseOptionsMenu: "m"

    pushFiles: "P"
    pullFiles: "p"
    refresh: "R"

    createPatchOptionsMenu: "<ctrl+p>"

    nextTab: "]"
    prevTab: "["
    nextScreenMode: "+"
    prevScreenMode: "_"

    undo: "z"
    redo: "<ctrl+z>"

    filteringMenu: "<ctrl+s>"
    diffingMenu: "W"
    copyToClipboard: "<ctrl+o>"

    submitEditorText: "<enter>"
    extrasMenu: "@"

    toggleWhitespaceInDiffView: "<ctrl+w>"
    increaseContextInDiffView: "}"
    decreaseContextInDiffView: "{"

  status:
    checkForUpdate: "u"
    recentRepos: "<enter>"

  files:
    commitChanges: "c"
    commitChangesWithoutHook: "w"
    amendLastCommit: "A"
    commitChangesWithEditor: "C"
    ignoreFile: "i"
    refreshFiles: "r"
    stashAllChanges: "s"
    viewStashOptions: "S"
    toggleStagedAll: "a"
    viewResetOptions: "D"
    fetch: "f"
    toggleTreeView: "`"

  branches:
    createPullRequest: "o"
    viewPullRequestOptions: "O"
    checkoutBranchByName: "c"
    forceCheckoutBranch: "F"
    rebaseBranch: "r"
    mergeIntoCurrentBranch: "M"
    viewGitFlowOptions: "i"
    fastForward: "f"
    pushTag: "P"
    setUpstream: "u"
    fetchRemote: "f"

  commits:
    squashDown: "s"
    renameCommit: "r"
    renameCommitWithEditor: "R"
    viewResetOptions: "g"
    markCommitAsFixup: "f"
    createFixupCommit: "F"
    squashAboveCommits: "S"
    moveDownCommit: "<ctrl+j>"
    moveUpCommit: "<ctrl+k>"
    amendToCommit: "A"
    pickCommit: "p"
    revertCommit: "t"
    cherryPickCopy: "c"
    pasteCommits: "v"
    tagCommit: "T"
    checkoutCommit: "<space>"

    # Use Ctrl+Shift+R so Ctrl+R can remain "recent repos".
    resetCherryPick: "<ctrl+shift+r>"

    openLogMenu: "<ctrl+l>"
    viewBisectOptions: "b"

  stash:
    popStash: "g"

  commitFiles:
    checkoutCommitFile: "c"

  main:
    toggleSelectHunk: "a"

  submodules:
    init: "i"
    update: "u"
    bulkMenu: "b"
